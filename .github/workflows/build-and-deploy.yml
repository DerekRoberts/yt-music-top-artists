name: Build and Deploy

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "${{ github.event_name == 'pull_request' && github.event.number || 'non-PR' }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Fetch artists data
        run: |
          cd scripts
          node fetch_artists.js
        env:
          # Add YouTube Music authentication environment variables here
          # YTMUSIC_EMAIL: ${{ secrets.YTMUSIC_EMAIL }}
          # YTMUSIC_PASSWORD: ${{ secrets.YTMUSIC_PASSWORD }}
          # Or OAuth credentials
          # YTMUSIC_OAUTH_TOKEN: ${{ secrets.YTMUSIC_OAUTH_TOKEN }}
          NODE_ENV: production

      - name: Commit data changes
        run: |
          if [ -n "$(git status --porcelain public/artists.json)" ]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add public/artists.json
            git commit -m "chore: update artists data

            - Fetched latest YouTube Music listening data
            - Updated artists.json with current top artists
            - Auto-generated by GitHub Actions"
            git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:${{ github.head_ref }}
            echo "✅ Artists data updated and committed"
          else
            echo "ℹ️ No changes detected in artists data"
          fi

      - name: Build React application
        run: |
          npm run build
          # Ensure artists.json is in dist for deployment
          cp public/artists.json dist/
          echo "📦 React app built with latest artists data"

      - name: PR Summary
        if: github.event_name == 'pull_request'
        run: |
          echo "✅ PR workflow completed successfully!"
          echo "🎵 Artists data was fetched and built"
          echo "📦 React app built successfully (deployment skipped for PR)"
          echo "📁 Preview available in workflow artifacts (pr-preview-${{ github.run_number }})"

      - name: Upload PR Preview Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-${{ github.run_number }}
          path: ./dist
          retention-days: 30

      - name: Upload GitHub Pages Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "🚀 Successfully deployed to GitHub Pages!"
          echo "📱 Site URL: ${{ steps.deployment.outputs.page_url }}"
          echo "🎵 Artists data was fetched and deployed"
