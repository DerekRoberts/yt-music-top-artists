name: Fetch YouTube Music Artists

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allow manual triggering
  push:
    branches: [main]
    paths: ["scripts/**"] # Only run when scripts change

jobs:
  fetch-artists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: |
          cd scripts
          npm init -y
          # Note: In real implementation, you would install youtubei.js or similar
          # npm install youtubei.js
          echo "Dependencies would be installed here"

      - name: Fetch artists data
        run: |
          cd scripts
          node fetch_artists.js
        env:
          # Add YouTube Music authentication environment variables here
          # YTMUSIC_EMAIL: ${{ secrets.YTMUSIC_EMAIL }}
          # YTMUSIC_PASSWORD: ${{ secrets.YTMUSIC_PASSWORD }}
          # Or OAuth credentials
          # YTMUSIC_OAUTH_TOKEN: ${{ secrets.YTMUSIC_OAUTH_TOKEN }}

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain public/artists.json)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/artists.json
          git commit -m "chore: update artists data

          - Fetched latest YouTube Music listening data
          - Updated artists.json with current top artists
          - Auto-generated by GitHub Actions"
          git push

      - name: Create deployment artifact
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          # Copy artists.json to dist for deployment
          mkdir -p dist
          cp public/artists.json dist/
          echo "Artists data copied to deployment directory"

      - name: Deploy to GitHub Pages
        if: steps.verify-changed-files.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "deploy: update artists data"

      - name: Summary
        run: |
          if [ "${{ steps.verify-changed-files.outputs.changed }}" == "true" ]; then
            echo "✅ Artists data updated and deployed successfully!"
          else
            echo "ℹ️ No changes detected in artists data"
          fi
