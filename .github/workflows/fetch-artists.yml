name: Fetch YouTube Music Artists

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allow manual triggering
  push:
    branches: [main]
    paths: ["scripts/**"] # Only run when scripts change

jobs:
  fetch-artists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          cd scripts
          # Note: In real implementation, you would install youtubei.js or similar
          # npm install youtubei.js
          echo "Dependencies would be installed here"

      - name: Fetch artists data
        run: |
          cd scripts
          node fetch_artists.js
        env:
          # Add YouTube Music authentication environment variables here
          # YTMUSIC_EMAIL: ${{ secrets.YTMUSIC_EMAIL }}
          # YTMUSIC_PASSWORD: ${{ secrets.YTMUSIC_PASSWORD }}
          # Or OAuth credentials
          # YTMUSIC_OAUTH_TOKEN: ${{ secrets.YTMUSIC_OAUTH_TOKEN }}
          NODE_ENV: production

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain public/artists.json)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/artists.json
          git commit -m "chore: update artists data

          - Fetched latest YouTube Music listening data
          - Updated artists.json with current top artists
          - Auto-generated by GitHub Actions"
          git push

      - name: Build React application
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          npm run build
          # Copy artists.json to dist for deployment
          cp public/artists.json dist/
          echo "Artists data copied to deployment directory"

      - name: Summary
        run: |
          if [ "${{ steps.verify-changed-files.outputs.changed }}" == "true" ]; then
            echo "✅ Artists data updated and committed successfully!"
            echo "📦 The main deploy.yml workflow will handle the deployment"
          else
            echo "ℹ️ No changes detected in artists data"
          fi
